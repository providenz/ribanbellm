[project]
name = "farm"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.3",
    "django-ninja>=1.8.0",
    "pydantic-ai-slim[anthropic,openai]>=2.69.0",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
