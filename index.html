<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RibambeLLM</title>
    <style>
      html, body { margin: 0; height: 100%; background: #1b1d26; overflow: hidden; }
      body { display: flex; }
      #game { position: relative; flex: 1; min-width: 0; height: 100%; }
      #controls {
        position: absolute; top: 12px; right: 12px; z-index: 1;
        padding: 8px 12px; border-radius: 8px; background: rgba(0, 0, 0, 0.45);
        color: #c8ccd8; font: 15px sans-serif; display: flex; gap: 8px; align-items: center;
      }
      #chat {
        width: 320px; height: 100%; display: flex; flex-direction: column;
        background: #14151c; border-left: 1px solid #2a2d3a; font: 15px/1.45 sans-serif; color: #d6d9e3;
      }
      #chat h1 { margin: 0; padding: 12px 14px 0; font-size: 20px; letter-spacing: 0.5px; color: #ffe36e; }
      #chat h2 { margin: 0; padding: 2px 14px 10px; font-size: 14px; font-weight: normal; color: #8a8fa3; border-bottom: 1px solid #2a2d3a; }
      #chat-list { flex: 1; margin: 0; padding: 8px 14px; list-style: none; overflow-y: auto; }
      #chat-list li { padding: 3px 0; overflow-wrap: anywhere; }
      .chat-name { font-weight: bold; }
      .chat-separator { margin-top: 8px; color: #8a8fa3; font-size: 13px; text-align: center; }
      .chat-note { color: #8a8fa3; font-style: italic; }
      #usage { padding: 8px 14px; border-top: 1px solid #2a2d3a; font-size: 13px; color: #8a8fa3; }
      #usage div { display: flex; gap: 8px; }
      .usage-label { flex: none; width: 82px; color: #d6d9e3; font-weight: bold; }
      @media (max-width: 800px) {
        body { flex-direction: column; }
        #game { height: 60%; }
        #chat { width: auto; height: 40%; border-left: none; border-top: 1px solid #2a2d3a; }
      }
    </style>
  </head>
  <body>
    <main id="game">
      <div id="controls">
        <label for="population">Personnages</label>
        <input id="population" type="range" min="2" max="10" value="5" />
        <span id="population-count">5</span>
      </div>
    </main>
    <aside id="chat">
      <h1>RibambeLLM</h1>
      <h2>Discussions en direct</h2>
      <ul id="chat-list"></ul>
      <footer id="usage">
        <div><span class="usage-label">Cette page</span><span id="usage-page"></span></div>
        <div><span class="usage-label">Total</span><span id="usage-total">...</span></div>
      </footer>
    </aside>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
